name: Bai 3 - SecureChat and NetRecon
on:
  push:
    paths: ['bai3/**', '.github/workflows/bai3-tests.yml']
  pull_request:
    paths: ['bai3/**', '.github/workflows/bai3-tests.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install lab dependencies
        run: python -m pip install -r bai3/requirements.txt
      - name: Real mTLS chat - encryption - TCP UDP - Flask - email preview
        run: python -u bai3/tools/demo.py
      - name: Install official Ubuntu Nmap package
        run: sudo apt-get update -qq && sudo apt-get install -y nmap
      - name: Real Nmap service detection on owned loopback fixture
        run: |
          python bai3/tools/serve_demo.py > /tmp/lab03-web.log 2>&1 &
          echo $! > /tmp/lab03-web.pid
          python -c "import time,urllib.request; time.sleep(2); print(urllib.request.urlopen('http://127.0.0.1:5000/').status)"
          cd bai3/netrecon
          python cli.py --target 127.0.0.1 --ports 8080 --mode service --nmap
      - uses: actions/upload-artifact@v4
        with:
          name: bai3-real-verification-evidence
          path: bai3/docs/evidence/
