name: Bai 3 - SecureChat and NetRecon
on:
  push:
    paths: ['bai3/**', '.github/workflows/bai3-tests.yml']
  pull_request:
    paths: ['bai3/**', '.github/workflows/bai3-tests.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install lab dependencies
        run: python -m pip install -r bai3/requirements.txt
      - name: Real mTLS chat - encryption - TCP UDP - Flask - email preview
        run: python -u bai3/tools/demo.py
      - name: Install official Ubuntu Nmap package
        run: sudo apt-get update -qq && sudo apt-get install -y nmap
      - name: Real Nmap service detection on owned loopback fixture
        run: |
          python bai3/tools/serve_demo.py > /tmp/lab03-web.log 2>&1 &
          echo $! > /tmp/lab03-web.pid
          python -c "import time,urllib.request; time.sleep(2); print(urllib.request.urlopen('http://127.0.0.1:5000/').status)"
          cd bai3/netrecon
          python cli.py --target 127.0.0.1 --ports 8080 --mode service --nmap
      - name: Capture real NetRecon UI in Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          python - <<'PY'
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          out = Path('bai3/docs/evidence/ui')
          out.mkdir(parents=True, exist_ok=True)
          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page(viewport={'width': 1280, 'height': 960})
              page.goto('http://127.0.0.1:5000/')
              page.screenshot(path=str(out/'08-netrecon-form.png'), full_page=True)
              page.get_by_label('Ports', exact=True).fill('8080,8443')
              page.get_by_role('button', name='Scan', exact=True).click()
              page.get_by_role('heading', name='Kết quả: 127.0.0.1').wait_for()
              page.screenshot(path=str(out/'09-netrecon-tcp-result.png'), full_page=True)
              page.goto('http://127.0.0.1:5000/')
              page.get_by_label('Ports', exact=True).fill('9999')
              page.locator('select[name=protocol]').select_option('udp')
              page.get_by_role('button', name='Scan', exact=True).click()
              page.get_by_role('heading', name='Kết quả: 127.0.0.1').wait_for()
              page.screenshot(path=str(out/'10-netrecon-udp-result.png'), full_page=True)
              page.goto('http://127.0.0.1:5000/')
              page.get_by_label('Target IP', exact=True).fill('192.0.2.1')
              page.get_by_role('button', name='Scan', exact=True).click()
              page.get_by_role('alert').wait_for()
              page.screenshot(path=str(out/'11-netrecon-whitelist-block.png'), full_page=True)
              browser.close()
          print('Captured 4 screenshots from the running Flask application using real form submissions.')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bai3-real-verification-evidence
          path: bai3/docs/evidence/

