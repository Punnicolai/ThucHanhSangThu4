name: Bai 6 - Docusaurus build
on:
  push:
    paths:
      - 'bai6/**'
      - '.github/workflows/bai6-build.yml'
  pull_request:
    paths:
      - 'bai6/**'
      - '.github/workflows/bai6-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bai6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: bai6/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: bai6-docusaurus-build
          path: bai6/build/
          if-no-files-found: error
          retention-days: 7
